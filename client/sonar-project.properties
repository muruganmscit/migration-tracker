# SonarQube settings for the client. Run the scanner from this folder after `npm run test:coverage`.
sonar.projectKey=migration-tracker-client
sonar.projectName=Migration Tracker Client
sonar.sources=src
sonar.tests=src
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**
# main.tsx only mounts the app; Reports.tsx is hidden and not routed. The same files are excluded in vitest.config.ts.
sonar.coverage.exclusions=src/main.tsx,src/pages/Reports.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
