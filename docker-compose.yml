services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: harness_migration_portal
    ports:
      - "5432:5432"
    volumes:
      - portal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d harness_migration_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP

  # The whole portal (client and API) in one container: http://localhost:4000
  server:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://portal:portal@postgres:5432/harness_migration_portal
      # Links in emails point at the portal, which this container now serves.
      APP_BASE_URL: http://localhost:4000
    ports:
      - "4000:4000"

volumes:
  portal_pgdata:
