# SonarQube settings for the server. Run the scanner from this folder after `npm run test:coverage`.
sonar.projectKey=migration-tracker-server
sonar.projectName=Migration Tracker Server
sonar.sources=src
sonar.tests=src
sonar.exclusions=src/**/*.test.ts,src/test/**
sonar.test.inclusions=src/**/*.test.ts,src/test/**
# Startup and data-loading scripts, not application logic. The same files are excluded in .c8rc.json.
sonar.coverage.exclusions=src/index.ts,src/seed.ts,src/scripts/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
